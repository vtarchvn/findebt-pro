<script>
const icons={dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="18" width="7" height="3" rx="1"/></svg>',users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v10H5a3 3 0 0 1-3-3V7"/><path d="M16 14h1"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3v18h18M7 16l4-5 4 3 5-8"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 18 6-6-6-6"/></svg>',qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg>',download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>'};
const nav=[['dashboard','Tổng quan','dashboard'],['partners','Đối tượng','users'],['debts','Công nợ','file'],['payments','Thu / Trả tiền','wallet'],['reminders','Nhắc nợ','bell'],['reports','Báo cáo','chart'],['settings','Cài đặt','settings']];
let state={config:{},partners:[],documents:[],dashboard:{kpis:{},aging:{},promises:{}},bankAccounts:[],promises:[]};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const vnd=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(v||0)); const date=v=>v?new Date(v).toLocaleDateString('vi-VN'):'—';
function rpc(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('Chỉ có thể gọi dữ liệu khi chạy trong Google Apps Script Web App.'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args)})}
function renderIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icons[el.dataset.icon]||'')}
function setupNav(){const html=nav.map(([id,label,icon],i)=>`${i===0?'<div class="nav-group">Vận hành</div>':''}${i===4?'<div class="nav-group">Kiểm soát</div>':''}<button data-page="${id}" class="${id==='dashboard'?'active':''}">${icons[icon]}<span>${label}</span></button>`).join('');$('#desktop-nav').innerHTML=html;$('#bottom-nav').innerHTML=nav.slice(0,5).map(([id,label,icon])=>`<button data-page="${id}" class="${id==='dashboard'?'active':''}">${icons[icon]}<span>${label}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${page}`));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#page-title').textContent=nav.find(n=>n[0]===page)?.[1]||'';if(page==='payments')setTimeout(()=>openModal('payment'),50)}
async function load(){try{state=await rpc('bootstrap');if(!state.initialized){showSetup();return}render()}catch(e){if(e.message.includes('không có')||e.message.includes('Thiếu sheet'))showSetup();else{$('#loading').innerHTML=`<div class="setup"><div class="loader-mark">!</div><h1>Chưa thể kết nối</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="load()">Thử lại</button></div>`}}}
function showSetup(){$('#loading').innerHTML=`<div class="setup"><div class="loader-mark">F.</div><h1>Khởi tạo FINDEBT</h1><p>Tạo kho dữ liệu Google Sheets riêng trong tài khoản của bạn. Không cần máy chủ, database hay cấu hình kỹ thuật.</p><input id="setup-name" placeholder="Tên doanh nghiệp"><button class="btn primary" onclick="initializeApp()">Khởi tạo an toàn</button></div>`}
async function initializeApp(){try{await rpc('initialize',{name:$('#setup-name').value||'Doanh nghiệp của tôi'});location.reload()}catch(e){toast(e.message,true)}}
function render(){document.documentElement.dataset.theme=localStorage.theme||state.config.THEME||'dark';$('#company-name-side').textContent=state.config.TEN_DOANH_NGHIEP||'Doanh nghiệp';$('#today-label').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());renderDashboard();renderPartners();renderDebts();renderReminders();renderReports();renderSettings();$('#app').hidden=false;$('#loading').remove();renderIcons()}
function sectionHead(eyebrow,title,desc,actions=''){return `<div class="hero-row"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function button(label,fn,primary=true,icon='plus'){return `<button class="btn ${primary?'primary':''}" onclick="${fn}"><i data-icon="${icon}"></i><span>${label}</span></button>`}
function renderDashboard(){const k=state.dashboard.kpis||{},a=state.dashboard.aging||{};const cards=[['Phải thu',k.receivable,'cyan','Dòng tiền vào'],['Phải trả',k.payable,'red','Nghĩa vụ thanh toán'],['Công nợ ròng',k.net,'indigo','Phải thu − phải trả'],['Nợ quá hạn',k.overdue,'amber','Cần xử lý ngay']];const max=Math.max(1,...Object.values(a).map(Number));const overdue=state.dashboard.overdue||[],dueSoon=state.dashboard.dueSoon||[];$('#page-dashboard').innerHTML=sectionHead('Bảng điều khiển','Nhịp tài chính hôm nay','Ưu tiên những khoản tiền cần được hành động.',button('Thu tiền nhanh',"openModal('payment')"))+`<div class="kpi-grid">${cards.map(([l,v,t,d])=>`<article class="card kpi" style="--tone:var(--${t})"><div class="kpi-head"><span>${l}</span><span class="kpi-icon">${icons.chart}</span></div><div class="value">${vnd(v)}</div><div class="delta"><strong>●</strong> ${d}</div></article>`).join('')}</div><div class="dashboard-grid"><article class="card panel"><div class="panel-head"><h3>Tuổi nợ phải thu</h3><span>Tính trên số còn lại</span></div><div class="aging-bars">${[['TRONG_HAN','Trong hạn','green'],['QUA_HAN_1_30','1–30 ngày','amber'],['QUA_HAN_31_60','31–60 ngày','red'],['QUA_HAN_TREN_60','Trên 60','indigo']].map(([key,label,t])=>`<div class="aging-item"><div class="aging-amount">${vnd(a[key])}</div><div class="bar-track"><div class="bar" style="--h:${Math.max(4,(a[key]||0)/max*100)}%;--tone:var(--${t})"></div></div><div class="aging-label">${label}</div></div>`).join('')}</div></article><article class="card panel"><div class="panel-head"><h3>Quá hạn ưu tiên</h3><span>${overdue.length} khoản</span></div>${debtList(overdue)}</article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Sắp đến hạn</h3><span>7 ngày tới</span></div>${debtList(dueSoon)}</article><article class="card panel"><div class="panel-head"><h3>Khách hẹn thanh toán</h3><span>Theo dõi cam kết</span></div>${promiseList()}</article></div>`}
function debtList(rows){if(!rows.length)return empty('Chưa có khoản công nợ');return `<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">${esc((r.So_Chung_Tu||'CT').slice(0,2))}</div><div class="list-main"><strong>${esc(partnerName(r.Ma_DT))}</strong><small>${esc(r.So_Chung_Tu)} · hạn ${date(r.Han_Thanh_Toan)}</small></div><div class="amount">${vnd(r.outstanding)}<small>${r.daysOverdue?`${r.daysOverdue} ngày`:''}</small></div></div>`).join('')}</div>`}
function promiseList(){const p=state.dashboard.promises||{};const rows=[...(p.late||[]),...(p.today||[]),...(p.upcoming||[])].slice(0,5);if(!rows.length)return empty('Chưa có lịch hẹn');return `<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">H</div><div class="list-main"><strong>${esc(partnerName(r.Ma_DT))}</strong><small>Hẹn ${date(r.Ngay_Hen)}</small></div><div class="amount">${vnd(r.So_Tien_Hen)}</div></div>`).join('')}</div>`}
function renderPartners(){const rows=state.partners||[];$('#page-partners').innerHTML=sectionHead('Danh mục','Đối tượng công nợ','Khách hàng và nhà cung cấp trong một hồ sơ thống nhất.',button('Thêm đối tượng',"openModal('partner')"))+`<div class="filterbar"><input class="field-inline" placeholder="Tìm theo mã, tên, số điện thoại..."><select class="field-inline"><option>Tất cả phân loại</option><option>Khách hàng</option><option>Nhà cung cấp</option></select></div><article class="card panel table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Mã</th><th>Tên đối tượng</th><th>Phân loại</th><th>Liên hệ</th><th>Hạn mức</th><th>Nhắc nợ</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="money">${esc(r.Ma_DT)}</td><td><strong>${esc(r.Ten_DT)}</strong><br><small style="color:var(--muted)">${esc(r.Nguoi_Lien_He||'')}</small></td><td><span class="badge">${r.Phan_Loai==='KHACH_HANG'?'Khách hàng':'Nhà cung cấp'}</span></td><td>${esc(r.So_Dien_Thoai||'—')}<br><small>${esc(r.Email||'')}</small></td><td class="money">${vnd(r.Han_Muc_Tin_Dung)}</td><td><span class="badge ${r.Cho_Phep_Nhac_No?'green':''}">${r.Cho_Phep_Nhac_No?'Đang bật':'Đang tắt'}</span></td></tr>`).join('')}</tbody></table>`:empty('Chưa có khách hàng hoặc nhà cung cấp')}</article>`}
function statusBadge(r){if(r.status==='DA_THANH_TOAN')return '<span class="badge green">Đã thanh toán</span>';if(r.status==='THANH_TOAN_MOT_PHAN')return '<span class="badge amber">Một phần</span>';if(r.status==='QUA_HAN')return '<span class="badge red">Quá hạn</span>';return '<span class="badge">Chưa thanh toán</span>'}
function renderDebts(){const rows=state.documents||[];$('#page-debts').innerHTML=sectionHead('Sổ công nợ','Chứng từ phải thu / phải trả','Outstanding và trạng thái được tính tự động phía máy chủ.',button('Thêm chứng từ',"openModal('document')"))+`<div class="filterbar"><input class="field-inline" placeholder="Tìm số chứng từ, đối tượng..."><select class="field-inline"><option>Tất cả</option><option>Phải thu</option><option>Phải trả</option><option>Quá hạn</option></select></div><article class="card panel table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Chứng từ</th><th>Đối tượng</th><th>Loại</th><th>Hạn TT</th><th>Tiền gốc</th><th>Còn lại</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.So_Chung_Tu)}</strong><br><small>${date(r.Ngay_Chung_Tu)}</small></td><td>${esc(partnerName(r.Ma_DT))}</td><td>${r.Loai_Cong_No==='PHAI_THU'?'Phải thu':'Phải trả'}</td><td>${date(r.Han_Thanh_Toan)}</td><td class="money">${vnd(r.originalAmount)}</td><td class="money">${vnd(r.outstanding)}</td><td>${statusBadge(r)}</td><td><div class="row-actions">${r.Loai_Cong_No==='PHAI_THU'&&r.outstanding>0?`<button class="mini-btn" title="VietQR" onclick="showQr('${esc(r.Ma_CT)}')">${icons.qr}</button>`:''}<button class="mini-btn" title="Thu/Trả tiền" onclick="openModal('payment','${esc(r.Ma_CT)}')">${icons.wallet}</button></div></td></tr>`).join('')}</tbody></table>`:empty('Chưa có chứng từ công nợ')}</article>`}
function renderReminders(){const p=state.dashboard.promises||{};$('#page-reminders').innerHTML=sectionHead('Tự động hóa','Nhắc nợ & lời hẹn','Lịch nhắc luôn dùng số tiền còn lại mới nhất.',button('Thêm lời hẹn',"openModal('promise')"))+`<div class="kpi-grid"><article class="card kpi" style="--tone:var(--green)"><div class="kpi-head"><span>Hẹn hôm nay</span></div><div class="value">${(p.today||[]).length}</div></article><article class="card kpi" style="--tone:var(--cyan)"><div class="kpi-head"><span>Hẹn sắp tới</span></div><div class="value">${(p.upcoming||[]).length}</div></article><article class="card kpi" style="--tone:var(--red)"><div class="kpi-head"><span>Hẹn đã trễ</span></div><div class="value">${(p.late||[]).length}</div></article><article class="card kpi" style="--tone:var(--indigo)"><div class="kpi-head"><span>Lịch nhắc</span></div><div class="value" style="font-size:15px">T−3 → T+30</div></article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Nguyên tắc an toàn</h3></div><div class="list"><div class="list-row"><div class="initial">01</div><div class="list-main"><strong>Không gửi trùng</strong><small>Mỗi chứng từ/ngày có khóa idempotency</small></div></div><div class="list-row"><div class="initial">02</div><div class="list-main"><strong>Dừng khi đã thanh toán</strong><small>Kiểm tra outstanding ngay trước khi gửi</small></div></div><div class="list-row"><div class="initial">03</div><div class="list-main"><strong>Tôn trọng lời hẹn</strong><small>Tạm dừng đến ngày khách đã hẹn</small></div></div></div></article><article class="card panel"><div class="panel-head"><h3>Thiết lập tự động</h3></div><p style="color:var(--muted);line-height:1.7;font-size:11px">Tạo trigger chạy hằng ngày lúc 08:00. Google sẽ yêu cầu cấp quyền gửi email trong lần đầu.</p><button class="btn" onclick="action('createReminderTrigger','Đã bật nhắc nợ tự động')">Bật trigger hằng ngày</button></article></div>`}
function renderReports(){$('#page-reports').innerHTML=sectionHead('Kiểm soát','Báo cáo & dữ liệu','Xuất dữ liệu, phiếu công nợ và sao lưu Drive.')+`<div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Phiếu công nợ PDF</h3><span>Snapshot tại thời điểm tạo</span></div><div class="field"><label>ĐỐI TƯỢNG</label><select id="report-partner">${partnerOptions()}</select></div><button class="btn primary" style="margin-top:14px" onclick="makePdf()">${icons.file} Tạo PDF</button></article><article class="card panel"><div class="panel-head"><h3>Backup Google Drive</h3><span>FINDEBT_PRO/BACKUPS</span></div><p style="color:var(--muted);font-size:11px">Tạo bản sao đầy đủ của kho dữ liệu để khôi phục khi cần.</p><div class="actions"><button class="btn" onclick="action('createBackup','Đã tạo backup an toàn')">${icons.download} Backup ngay</button><button class="btn" onclick="openBackups()">Khôi phục</button><button class="btn" onclick="action('createBackupTrigger','Đã bật backup tự động lúc 02:00')">Tự động</button></div></article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Export dữ liệu</h3><span>CSV tương thích Excel</span></div><div class="actions"><button class="btn" onclick="downloadCsv('DOI_TUONG')">Đối tượng</button><button class="btn" onclick="downloadCsv('CHUNG_TU_CONG_NO')">Chứng từ</button><button class="btn" onclick="downloadCsv('THANH_TOAN')">Thanh toán</button></div></article><article class="card panel"><div class="panel-head"><h3>Import CSV</h3><span>Báo lỗi theo từng dòng</span></div><div class="form-grid"><div class="field"><label>LOẠI DỮ LIỆU</label><select id="import-type"><option value="DOI_TUONG">Đối tượng</option><option value="CHUNG_TU_CONG_NO">Chứng từ</option></select></div><div class="field"><label>FILE CSV (TỐI ĐA 2 MB)</label><input id="import-file" type="file" accept=".csv,text/csv"></div></div><button class="btn" style="margin-top:14px" onclick="uploadCsv()">Kiểm tra & Import</button></article></div>`}
function renderSettings(){$('#page-settings').innerHTML=sectionHead('Hệ thống','Cài đặt doanh nghiệp','Tài khoản ngân hàng, email và vận hành dữ liệu.',button('Thêm tài khoản',"openModal('bank')"))+`<div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Doanh nghiệp</h3></div><div class="list"><div class="list-row"><div class="initial">DN</div><div class="list-main"><strong>${esc(state.config.TEN_DOANH_NGHIEP)}</strong><small>Kho dữ liệu riêng trên Google Sheets</small></div><span class="badge green">Sẵn sàng</span></div></div></article><article class="card panel"><div class="panel-head"><h3>Tài khoản VietQR</h3><span>${state.bankAccounts.length} tài khoản</span></div>${state.bankAccounts.length?`<div class="list">${state.bankAccounts.map(a=>`<div class="list-row"><div class="initial">${esc(a.Ma_Ngan_Hang.slice(0,2))}</div><div class="list-main"><strong>${esc(a.Ten_Hien_Thi||a.Ma_Ngan_Hang)}</strong><small>${esc(a.So_Tai_Khoan)} · ${esc(a.Ten_Chu_Tai_Khoan)}</small></div>${a.Mac_Dinh?'<span class="badge green">Mặc định</span>':''}</div>`).join('')}</div>`:empty('Chưa có tài khoản ngân hàng')}</article></div>`}
function partnerOptions(){return state.partners.map(p=>`<option value="${esc(p.Ma_DT)}">${esc(p.Ma_DT)} — ${esc(p.Ten_DT)}</option>`).join('')}
function openModal(type,preset=''){const templates={partner:{title:'Thêm đối tượng',desc:'Tạo hồ sơ khách hàng hoặc nhà cung cấp.',fields:`<div class="field"><label>TÊN ĐỐI TƯỢNG *</label><input name="Ten_DT" required></div><div class="field"><label>PHÂN LOẠI</label><select name="Phan_Loai"><option value="KHACH_HANG">Khách hàng</option><option value="NHA_CUNG_CAP">Nhà cung cấp</option></select></div><div class="field"><label>SỐ ĐIỆN THOẠI</label><input name="So_Dien_Thoai"></div><div class="field"><label>EMAIL</label><input type="email" name="Email"></div><div class="field"><label>HẠN MỨC TÍN DỤNG</label><input type="number" min="0" step="1" name="Han_Muc_Tin_Dung" value="0"></div><div class="field"><label>THỜI HẠN NỢ CHUẨN (NGÀY)</label><input type="number" name="Thoi_Han_No_Chuan" value="30"></div><div class="field full"><label>ĐỊA CHỈ</label><input name="Dia_Chi"></div><label class="checkbox full"><input type="checkbox" name="Cho_Phep_Nhac_No" checked> Cho phép nhắc nợ</label>`,rpc:'savePartner'},document:{title:'Thêm chứng từ',desc:'Ghi nhận khoản phải thu hoặc phải trả mới.',fields:`<div class="field"><label>ĐỐI TƯỢNG *</label><select name="Ma_DT">${partnerOptions()}</select></div><div class="field"><label>LOẠI CÔNG NỢ</label><select name="Loai_Cong_No"><option value="PHAI_THU">Phải thu</option><option value="PHAI_TRA">Phải trả</option></select></div><div class="field"><label>SỐ CHỨNG TỪ *</label><input name="So_Chung_Tu" required></div><div class="field"><label>SỐ TIỀN GỐC *</label><input type="number" min="1" step="1" name="So_Tien_Goc" required></div><div class="field"><label>NGÀY CHỨNG TỪ</label><input type="date" name="Ngay_Chung_Tu" value="${isoToday()}"></div><div class="field"><label>HẠN THANH TOÁN</label><input type="date" name="Han_Thanh_Toan" value="${isoToday()}"></div><div class="field full"><label>DIỄN GIẢI</label><textarea name="Dien_Giai"></textarea></div>`,rpc:'createDocument'},payment:{title:'Ghi nhận thu / trả tiền',desc:'Phân bổ thanh toán vào chứng từ còn dư.',fields:paymentFields(preset),rpc:'recordPayment'},promise:{title:'Khách hẹn thanh toán',desc:'Tạm dừng nhắc nợ đến ngày đã cam kết.',fields:`<div class="field"><label>ĐỐI TƯỢNG</label><select name="Ma_DT">${partnerOptions()}</select></div><div class="field"><label>CHỨNG TỪ</label><select name="Ma_CT"><option value="">Toàn bộ công nợ</option>${state.documents.filter(d=>d.outstanding>0).map(d=>`<option value="${esc(d.Ma_CT)}">${esc(d.So_Chung_Tu)} — ${vnd(d.outstanding)}</option>`)}</select></div><div class="field"><label>NGÀY HẸN</label><input type="date" name="Ngay_Hen" value="${isoToday()}"></div><div class="field"><label>SỐ TIỀN HẸN</label><input type="number" min="1" name="So_Tien_Hen"></div><div class="field full"><label>GHI CHÚ</label><textarea name="Ghi_Chu"></textarea></div>`,rpc:'savePromise'},bank:{title:'Thêm tài khoản ngân hàng',desc:'Dùng để tạo VietQR cho khoản phải thu.',fields:`<div class="field"><label>MÃ NGÂN HÀNG *</label><input name="Ma_Ngan_Hang" placeholder="VCB, TCB, MB..."></div><div class="field"><label>SỐ TÀI KHOẢN *</label><input name="So_Tai_Khoan"></div><div class="field full"><label>TÊN CHỦ TÀI KHOẢN *</label><input name="Ten_Chu_Tai_Khoan"></div><div class="field full"><label>TÊN HIỂN THỊ</label><input name="Ten_Hien_Thi"></div><label class="checkbox full"><input type="checkbox" name="Mac_Dinh"> Đặt làm mặc định</label>`,rpc:'saveBankAccount'}};const t=templates[type];$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><h3>${t.title}</h3><p>${t.desc}</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><form id="entity-form" data-rpc="${t.rpc}"><div class="form-grid">${t.fields}</div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu dữ liệu</button></div></form></div></div>`;$('#entity-form').onsubmit=submitForm}
function paymentFields(preset){const open=state.documents.filter(d=>d.outstanding>0);return `<div class="field"><label>ĐỐI TƯỢNG</label><select name="Ma_DT">${partnerOptions()}</select></div><div class="field"><label>LOẠI</label><select name="Loai_Cong_No"><option value="PHAI_THU">Thu tiền</option><option value="PHAI_TRA">Trả tiền NCC</option></select></div><div class="field"><label>NGÀY THANH TOÁN</label><input type="date" name="Ngay_Thanh_Toan" value="${isoToday()}"></div><div class="field"><label>SỐ TIỀN</label><input type="number" min="1" name="So_Tien" id="pay-amount"></div><div class="field full"><label>PHÂN BỔ VÀO CHỨNG TỪ</label><select id="pay-doc">${open.map(d=>`<option value="${esc(d.Ma_CT)}" data-amount="${d.outstanding}" ${d.Ma_CT===preset?'selected':''}>${esc(d.So_Chung_Tu)} — còn ${vnd(d.outstanding)}</option>`).join('')}</select></div><div class="field"><label>PHƯƠNG THỨC</label><select name="Phuong_Thuc"><option>CHUYEN_KHOAN</option><option>TIEN_MAT</option></select></div><div class="field"><label>THAM CHIẾU</label><input name="Tham_Chieu"></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
async function submitForm(e){e.preventDefault();const form=e.target,data={};new FormData(form).forEach((v,k)=>data[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>data[c.name]=c.checked);if(form.dataset.rpc==='recordPayment'){const doc=$('#pay-doc'),selected=doc.options[doc.selectedIndex];data.Phan_Bo=[{Ma_CT:doc.value,So_Tien_Phan_Bo:Number(data.So_Tien)}];const document=state.documents.find(d=>d.Ma_CT===doc.value);if(document){data.Ma_DT=document.Ma_DT;data.Loai_Cong_No=document.Loai_Cong_No}if(Number(data.So_Tien)>Number(selected?.dataset.amount||0)){toast('Số tiền vượt dư còn lại của chứng từ',true);return}}try{form.querySelector('button[type=submit],button.btn.primary').disabled=true;const result=await rpc(form.dataset.rpc,data);if(result?.credit?.exceeded)toast(`Cảnh báo: vượt hạn mức ${vnd(result.credit.exceededBy)}`,true);else toast('Đã lưu dữ liệu');closeModal();state=await rpc('bootstrap');render()}catch(err){toast(err.message,true);form.querySelector('button[type=submit],button.btn.primary').disabled=false}}
async function showQr(id){try{const r=await rpc('getVietQr',id,'');$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px;text-align:center"><div class="modal-head"><div><h3>Thu tiền VietQR</h3><p>Số tiền còn phải thu: ${vnd(r.amount)}</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><img src="${esc(r.url)}" alt="VietQR" style="width:min(300px,100%);border-radius:16px;background:white"><p style="color:var(--muted);font-size:10px">QR luôn dùng outstanding mới nhất từ máy chủ.</p></div></div>`}catch(e){toast(e.message,true)}}
async function action(name,message){try{await rpc(name);toast(message)}catch(e){toast(e.message,true)}}async function makePdf(){try{const r=await rpc('generateDebtPdf',$('#report-partner').value);toast(`Đã tạo PDF ${vnd(r.total)}`);window.open(r.url,'_blank')}catch(e){toast(e.message,true)}}async function downloadCsv(table){try{const csv=await rpc('exportCsv',table),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FINDEBT_${table}_${isoToday()}.csv`;a.click();URL.revokeObjectURL(a.href)}catch(e){toast(e.message,true)}}
async function uploadCsv(){const file=$('#import-file').files[0];if(!file){toast('Hãy chọn file CSV',true);return}if(file.size>2000000){toast('File vượt giới hạn 2 MB',true);return}try{const result=await rpc('importCsv',$('#import-type').value,await file.text(),file.name);toast(`Import: ${result.success} thành công, ${result.failed} lỗi`,result.failed>0);state=await rpc('bootstrap');render()}catch(e){toast(e.message,true)}}
async function openBackups(){try{const rows=await rpc('listBackups');$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><h3>Khôi phục backup</h3><p>Thao tác sẽ ghi đè kho hiện tại. Hãy tạo backup mới trước.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div>${rows.length?`<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">BK</div><div class="list-main"><strong>${esc(r.name)}</strong><small>${date(r.updatedAt)}</small></div><button class="btn danger" onclick="restore('${esc(r.id)}')">Khôi phục</button></div>`).join('')}</div>`:empty('Chưa có bản backup')}</div></div>`}catch(e){toast(e.message,true)}}
async function restore(id){if(!confirm('Khôi phục sẽ ghi đè toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;try{await rpc('restoreBackup',id);toast('Khôi phục thành công');location.reload()}catch(e){toast(e.message,true)}}
function toast(message,error=false){const el=document.createElement('div');el.className=`toast ${error?'error':''}`;el.textContent=message;$('#toast-stack').append(el);setTimeout(()=>el.remove(),4500)}function empty(text){return `<div class="empty"><div class="empty-icon">${icons.file}</div>${text}</div>`}function partnerName(id){return state.partners.find(p=>p.Ma_DT===id)?.Ten_DT||id}function isoToday(){return new Date().toISOString().slice(0,10)}
setupNav();renderIcons();$('#theme-btn').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.theme=theme};$('#global-search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.data-table tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))};load();
</script>
</body>
</html>
