function showSetup(session={}){$('#loading').innerHTML=`<div class="workspace-setup"><div class="setup-head"><div class="loader-mark" style="margin:auto">F.</div><h1>Bắt đầu với workspace của bạn</h1><p>FINDEBT tạo Google Sheet và toàn bộ thư mục báo cáo, nhập liệu, backup trong Drive của tài khoản đang đăng nhập.</p><span class="setup-account">Tài khoản Google · ${esc(session.email||'đang xác thực')}</span></div><div class="setup-grid"><article class="card setup-option setup-primary"><div class="eyebrow">Thiết lập chính · khoảng 1 phút</div><h2>Tạo workspace mới</h2><p>Dành cho lần sử dụng đầu tiên. FINDEBT sẽ tự sắp xếp mọi dữ liệu vào một thư mục Drive riêng và cấp bạn quyền Owner.</p><div class="field"><label>TÊN DOANH NGHIỆP</label><input id="setup-name" placeholder="Ví dụ: Công ty Kiến trúc VTARC" autocomplete="organization"></div><div class="setup-steps"><div class="setup-step"><b>01</b><div><strong>Thư mục Drive riêng</strong><small>Dữ liệu, báo cáo, import và backup được xếp đúng chỗ.</small></div></div><div class="setup-step"><b>02</b><div><strong>Google Sheet Data Console</strong><small>Dùng để xem tổng thể, lọc và nhập hàng loạt.</small></div></div><div class="setup-step"><b>03</b><div><strong>Quyền sở hữu an toàn</strong><small>Chỉ bạn và thành viên được mời mới truy cập dữ liệu.</small></div></div></div><button class="btn primary" onclick="initializeApp(event)">Tạo workspace mới</button></article><aside class="card setup-option setup-optional"><div class="eyebrow">Tùy chọn</div><h2>Bạn đã có workspace?</h2><p>Chỉ dùng khi chủ doanh nghiệp đã chia sẻ cả thư mục FINDEBT cho email này.</p><details class="setup-disclosure"><summary>Liên kết thư mục đã có</summary><div class="setup-disclosure-body"><div class="field"><label>LINK HOẶC ID THƯ MỤC GỐC</label><input id="workspace-folder" placeholder="https://drive.google.com/drive/folders/..."></div><div class="notice">Bạn cần cả quyền Drive và quyền thành viên trong FINDEBT.</div><button class="btn" onclick="connectWorkspaceUi(event)">Kiểm tra và liên kết</button></div></details></aside></div></div>`}
let setupProgressTimer=null,pendingWorkspaceData=null,setupRetryName='';
const setupPhases=[['Xác nhận tài khoản Google','Kiểm tra quyền tạo dữ liệu trong Drive'],['Tạo cấu trúc thư mục','Sắp xếp Data, Imports, Reports và Backups'],['Tạo Google Sheet Console','Thiết lập bảng tổng quan và vùng nhập hàng loạt'],['Hoàn tất workspace','Gắn quyền Owner và lưu manifest liên kết']];
async function initializeApp(e){const name=$('#setup-name').value.trim()||'Doanh nghiệp của tôi';e.currentTarget.disabled=true;showSetupProgress(name);try{const result=await rpc('createWorkspace',{name});finishSetupProgress();setTimeout(()=>showWorkspaceSuccess(result,false),350)}catch(error){stopSetupProgress();showSetupError(error.message,name)}}
function showSetupProgress(name){let phase=0;$('#loading').innerHTML=`<div class="card setup-progress"><div class="progress-head"><div><div class="eyebrow">Đang thiết lập</div><h1>${esc(name)}</h1><p>Giữ trang này mở trong lúc FINDEBT chuẩn bị workspace.</p></div><div id="setup-percent" class="progress-percent">20%</div></div><div class="progress-rail"><div id="setup-progress-fill" class="progress-fill" style="--progress:20%"></div></div><div id="setup-progress-list" class="progress-list">${setupPhases.map((phase,index)=>`<div class="progress-row ${index===0?'active':''}" data-setup-phase="${index}"><span class="progress-icon">${String(index+1).padStart(2,'0')}</span><div><strong>${phase[0]}</strong><small>${phase[1]}</small></div><span class="phase-state">${index===0?'Đang xử lý':'Chờ'}</span></div>`).join('')}</div></div>`;setupProgressTimer=setInterval(()=>{if(phase<setupPhases.length-1){phase+=1;setSetupPhase(phase)}},1400)}
function setSetupPhase(active){document.querySelectorAll('[data-setup-phase]').forEach((row,index)=>{row.classList.toggle('done',index<active);row.classList.toggle('active',index===active);row.querySelector('.progress-icon').textContent=index<active?'✓':String(index+1).padStart(2,'0');row.querySelector('.phase-state').textContent=index<active?'Xong':index===active?'Đang xử lý':'Chờ'});const percent=Math.min(88,20+active*22);$('#setup-progress-fill').style.setProperty('--progress',`${percent}%`);$('#setup-percent').textContent=`${percent}%`}
function finishSetupProgress(){stopSetupProgress();document.querySelectorAll('[data-setup-phase]').forEach(row=>{row.classList.add('done');row.classList.remove('active');row.querySelector('.progress-icon').textContent='✓';row.querySelector('.phase-state').textContent='Xong'});$('#setup-progress-fill')?.style.setProperty('--progress','100%');if($('#setup-percent'))$('#setup-percent').textContent='100%'}
function stopSetupProgress(){if(setupProgressTimer){clearInterval(setupProgressTimer);setupProgressTimer=null}}
function showWorkspaceSuccess(result,linked=false){pendingWorkspaceData=result?.data||null;const workspace=result?.data?.workspace||result?.session||{},company=result?.data?.config?.TEN_DOANH_NGHIEP||'Workspace FINDEBT';$('#loading').innerHTML=`<div class="workspace-success"><article class="card success-card"><div class="success-mark">✓</div><div class="eyebrow" style="margin-top:20px">${linked?'Liên kết hoàn tất':'Thiết lập hoàn tất'}</div><h1>${linked?'Workspace đã được liên kết':'Workspace đã sẵn sàng'}</h1><p><strong>${esc(company)}</strong> đã có nơi lưu dữ liệu riêng. Bạn có thể mở thử thư mục Drive và Google Sheet trước khi vào ứng dụng.</p><div class="created-links"><a class="created-link" href="${esc(workspace.rootFolderUrl)}" target="_blank" rel="noopener"><b>DR</b><span><strong>Mở thư mục Drive</strong><small>Xem toàn bộ cấu trúc workspace</small></span><span>↗</span></a><a class="created-link" href="${esc(workspace.spreadsheetUrl)}" target="_blank" rel="noopener"><b>SH</b><span><strong>Mở Google Sheet</strong><small>Xem Data Console và bảng nhập liệu</small></span><span>↗</span></a></div><div class="notice" style="color:var(--green);background:rgba(94,226,139,.08)">Dữ liệu chỉ được chia sẻ khi Owner thêm thành viên trong phần Cài đặt.</div><div class="setup-actions"><button class="btn primary" onclick="enterCreatedWorkspace()">Vào FINDEBT</button></div></article></div>`}
function enterCreatedWorkspace(){if(pendingWorkspaceData){state=pendingWorkspaceData;render();loadDeferredData()}else location.reload()}
function showSetupError(message,name){setupRetryName=name;$('#loading').innerHTML=`<div class="workspace-success"><article class="card success-card"><div class="success-mark" style="color:var(--red);background:rgba(255,129,150,.08);border-color:rgba(255,129,150,.25)">×</div><h1>Chưa tạo được workspace</h1><p>${esc(message)}</p><div class="setup-actions"><button class="btn primary" onclick="retryWorkspaceSetup()">Thử lại</button></div></article></div>`}
function retryWorkspaceSetup(){showSetup({});const input=$('#setup-name');if(input)input.value=setupRetryName}
async function connectWorkspaceUi(e){const value=$('#workspace-folder').value.trim(),match=value.match(/folders\/([\w-]+)/),id=match?match[1]:value;if(!id){toast('Hãy nhập link hoặc ID thư mục Drive',true);return}const button=e.currentTarget;try{button.disabled=true;button.textContent='Đang kiểm tra quyền…';const result=await rpc('connectWorkspace',id);showWorkspaceSuccess(result,true)}catch(error){toast(error.message,true);button.disabled=false;button.textContent='Kiểm tra và liên kết'}}
function render(preferredPage=''){document.documentElement.dataset.theme=storageGet('theme')||state.config.THEME||'dark';document.body.dataset.role=state.workspace?.role||'VIEWER';setupNav();$('#company-name-side').textContent=state.config.TEN_DOANH_NGHIEP||'Doanh nghiệp';$('#today-label').textContent=`${state.workspace?.email||''} · ${roleLabel(state.workspace?.role)} · `+new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());renderDashboardV2();injectHealth();renderPartners();renderDebtsV2();renderReminders();renderReportsV2();renderSettingsV3();renderAbout();$('#app').hidden=false;$('#loading')?.remove();renderIcons();const requested=preferredPage||location.hash.slice(1)||'dashboard';go(requested,false)}
function sectionHead(eyebrow,title,desc,actions=''){return `<div class="hero-row"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function injectHealth(){document.querySelector('.health-strip')?.remove();const h=state.health,issue=h?.issues?.[0];$('#page-dashboard')?.insertAdjacentHTML('afterbegin',h?`<article class="card health-strip"><div class="health-score" style="--score:${Number(h.score||0)}"><b>${Number(h.score||0)}</b></div><div class="health-copy"><strong>Sức khỏe workspace ${h.score>=90?'tốt':h.score>=70?'cần theo dõi':'cần xử lý'}</strong><small>${esc(issue?.message||'Dữ liệu, phân quyền và backup đang ổn định.')}</small></div><button class="btn" onclick="go('settings')">Xem kiểm soát</button></article>`:`<article class="card health-strip health-loading"><div class="loader-mark" style="width:38px;height:38px;border-radius:10px">···</div><div class="health-copy"><strong>Đang kiểm tra workspace ở nền</strong><small>Bạn có thể làm việc ngay; kết quả Drive và backup sẽ xuất hiện sau.</small></div></article>`)}
function roleLabel(role){return ({OWNER:'Chủ sở hữu',ADMIN:'Quản trị',ACCOUNTANT:'Kế toán',VIEWER:'Chỉ xem'})[role]||'Chỉ xem'}
function button(label,fn,primary=true,icon='plus'){return `<button class="btn ${primary?'primary':''}" onclick="${fn}"><i data-icon="${icon}"></i><span>${label}</span></button>`}
function renderDashboard(){const k=state.dashboard.kpis||{},a=state.dashboard.aging||{};const cards=[['Phải thu',k.receivable,'cyan','Dòng tiền vào'],['Phải trả',k.payable,'red','Nghĩa vụ thanh toán'],['Công nợ ròng',k.net,'indigo','Phải thu − phải trả'],['Nợ quá hạn',k.overdue,'amber','Cần xử lý ngay']];const max=Math.max(1,...Object.values(a).map(Number));const overdue=state.dashboard.overdue||[],dueSoon=state.dashboard.dueSoon||[];$('#page-dashboard').innerHTML=sectionHead('Bảng điều khiển','Nhịp tài chính hôm nay','Ưu tiên những khoản tiền cần được hành động.',button('Thu tiền nhanh',"openModal('payment')"))+`<div class="kpi-grid">${cards.map(([l,v,t,d])=>`<article class="card kpi" style="--tone:var(--${t})"><div class="kpi-head"><span>${l}</span><span class="kpi-icon">${icons.chart}</span></div><div class="value">${vnd(v)}</div><div class="delta"><strong>●</strong> ${d}</div></article>`).join('')}</div><div class="dashboard-grid"><article class="card panel"><div class="panel-head"><h3>Tuổi nợ phải thu</h3><span>Tính trên số còn lại</span></div><div class="aging-bars">${[['TRONG_HAN','Trong hạn','green'],['QUA_HAN_1_30','1–30 ngày','amber'],['QUA_HAN_31_60','31–60 ngày','red'],['QUA_HAN_TREN_60','Trên 60','indigo']].map(([key,label,t])=>`<div class="aging-item"><div class="aging-amount">${vnd(a[key])}</div><div class="bar-track"><div class="bar" style="--h:${Math.max(4,(a[key]||0)/max*100)}%;--tone:var(--${t})"></div></div><div class="aging-label">${label}</div></div>`).join('')}</div></article><article class="card panel"><div class="panel-head"><h3>Quá hạn ưu tiên</h3><span>${overdue.length} khoản</span></div>${debtList(overdue)}</article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Sắp đến hạn</h3><span>7 ngày tới</span></div>${debtList(dueSoon)}</article><article class="card panel"><div class="panel-head"><h3>Khách hẹn thanh toán</h3><span>Theo dõi cam kết</span></div>${promiseList()}</article></div>`}
function debtList(rows){if(!rows.length)return empty('Chưa có khoản công nợ');return `<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">${esc((r.So_Chung_Tu||'CT').slice(0,2))}</div><div class="list-main"><strong>${esc(partnerName(r.Ma_DT))}</strong><small>${esc(r.So_Chung_Tu)} · hạn ${date(r.Han_Thanh_Toan)}</small></div><div class="amount">${vnd(r.outstanding)}<small>${r.daysOverdue?`${r.daysOverdue} ngày`:''}</small></div></div>`).join('')}</div>`}
function promiseList(){const p=state.dashboard.promises||{};const rows=[...(p.late||[]),...(p.today||[]),...(p.upcoming||[])].slice(0,5);if(!rows.length)return empty('Chưa có lịch hẹn');return `<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">H</div><div class="list-main"><strong>${esc(partnerName(r.Ma_DT))}</strong><small>Hẹn ${date(r.Ngay_Hen)}</small></div><div class="amount">${vnd(r.So_Tien_Hen)}</div></div>`).join('')}</div>`}
function renderPartners(){const rows=state.partners||[];$('#page-partners').innerHTML=sectionHead('Danh mục','Khách hàng & Nhà cung cấp','Quản lý thông tin liên hệ và chính sách công nợ tại một nơi.',button('Thêm khách hàng / NCC',"openModal('partner')"))+`<div class="filterbar"><input class="field-inline" placeholder="Tìm theo mã, tên, số điện thoại..."><select class="field-inline"><option>Tất cả phân loại</option><option>Khách hàng</option><option>Nhà cung cấp</option></select></div><article class="card panel table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Mã</th><th>Tên khách hàng / NCC</th><th>Phân loại</th><th>Liên hệ</th><th>Hạn mức</th><th>Nhắc nợ</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="money">${esc(r.Ma_DT)}</td><td><strong>${esc(r.Ten_DT)}</strong><br><small style="color:var(--muted)">${esc(r.Nguoi_Lien_He||'')}</small></td><td><span class="badge">${r.Phan_Loai==='KHACH_HANG'?'Khách hàng':'Nhà cung cấp'}</span></td><td>${esc(r.So_Dien_Thoai||'—')}<br><small>${esc(r.Email||'')}</small></td><td class="money">${vnd(r.Han_Muc_Tin_Dung)}</td><td><span class="badge ${r.Cho_Phep_Nhac_No?'green':''}">${r.Cho_Phep_Nhac_No?'Đang bật':'Đang tắt'}</span></td></tr>`).join('')}</tbody></table>`:empty('Chưa có khách hàng hoặc nhà cung cấp')}</article>`}
function statusBadge(r){if(r.status==='DA_THANH_TOAN')return '<span class="badge green">Đã thanh toán</span>';if(r.status==='THANH_TOAN_MOT_PHAN')return '<span class="badge amber">Một phần</span>';if(r.status==='QUA_HAN')return '<span class="badge red">Quá hạn</span>';return '<span class="badge">Chưa thanh toán</span>'}
function renderDebts(){const rows=state.documents||[];$('#page-debts').innerHTML=sectionHead('Sổ công nợ','Chứng từ phải thu / phải trả','Outstanding và trạng thái được tính tự động phía máy chủ.',button('Thêm chứng từ',"openModal('document')"))+`<div class="filterbar"><input class="field-inline" placeholder="Tìm số chứng từ, đối tượng..."><select class="field-inline"><option>Tất cả</option><option>Phải thu</option><option>Phải trả</option><option>Quá hạn</option></select></div><article class="card panel table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Chứng từ</th><th>Đối tượng</th><th>Loại</th><th>Hạn TT</th><th>Tiền gốc</th><th>Còn lại</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.So_Chung_Tu)}</strong><br><small>${date(r.Ngay_Chung_Tu)}</small></td><td>${esc(partnerName(r.Ma_DT))}</td><td>${r.Loai_Cong_No==='PHAI_THU'?'Phải thu':'Phải trả'}</td><td>${date(r.Han_Thanh_Toan)}</td><td class="money">${vnd(r.originalAmount)}</td><td class="money">${vnd(r.outstanding)}</td><td>${statusBadge(r)}</td><td><div class="row-actions">${r.Loai_Cong_No==='PHAI_THU'&&r.outstanding>0?`<button class="mini-btn" title="VietQR" onclick="showQr('${esc(r.Ma_CT)}')">${icons.qr}</button>`:''}<button class="mini-btn" title="Thu/Trả tiền" onclick="openModal('payment','${esc(r.Ma_CT)}')">${icons.wallet}</button></div></td></tr>`).join('')}</tbody></table>`:empty('Chưa có chứng từ công nợ')}</article>`}
function renderReminders(){const p=state.dashboard.promises||{};$('#page-reminders').innerHTML=sectionHead('Tự động hóa','Nhắc nợ & lời hẹn','Lịch nhắc luôn dùng số tiền còn lại mới nhất.',button('Thêm lời hẹn',"openModal('promise')"))+`<div class="kpi-grid"><article class="card kpi" style="--tone:var(--green)"><div class="kpi-head"><span>Hẹn hôm nay</span></div><div class="value">${(p.today||[]).length}</div></article><article class="card kpi" style="--tone:var(--cyan)"><div class="kpi-head"><span>Hẹn sắp tới</span></div><div class="value">${(p.upcoming||[]).length}</div></article><article class="card kpi" style="--tone:var(--red)"><div class="kpi-head"><span>Hẹn đã trễ</span></div><div class="value">${(p.late||[]).length}</div></article><article class="card kpi" style="--tone:var(--indigo)"><div class="kpi-head"><span>Lịch nhắc</span></div><div class="value" style="font-size:15px">T−3 → T+30</div></article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Nguyên tắc an toàn</h3></div><div class="list"><div class="list-row"><div class="initial">01</div><div class="list-main"><strong>Không gửi trùng</strong><small>Mỗi chứng từ/ngày có khóa idempotency</small></div></div><div class="list-row"><div class="initial">02</div><div class="list-main"><strong>Dừng khi đã thanh toán</strong><small>Kiểm tra outstanding ngay trước khi gửi</small></div></div><div class="list-row"><div class="initial">03</div><div class="list-main"><strong>Tôn trọng lời hẹn</strong><small>Tạm dừng đến ngày khách đã hẹn</small></div></div></div></article><article class="card panel"><div class="panel-head"><h3>Thiết lập tự động</h3></div><p style="color:var(--muted);line-height:1.7;font-size:11px">Tạo trigger chạy hằng ngày lúc 08:00. Google sẽ yêu cầu cấp quyền gửi email trong lần đầu.</p><button class="btn" onclick="action('createReminderTrigger','Đã bật nhắc nợ tự động')">Bật trigger hằng ngày</button></article></div>`}
function renderReports(){$('#page-reports').innerHTML=sectionHead('Kiểm soát','Báo cáo & dữ liệu','Xuất dữ liệu, phiếu công nợ và sao lưu Drive.')+`<div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Phiếu công nợ PDF</h3><span>Snapshot tại thời điểm tạo</span></div><div class="field"><label>ĐỐI TƯỢNG</label><select id="report-partner">${partnerOptions()}</select></div><button class="btn primary" style="margin-top:14px" onclick="makePdf()">${icons.file} Tạo PDF</button></article><article class="card panel"><div class="panel-head"><h3>Backup Google Drive</h3><span>FINDEBT_PRO/BACKUPS</span></div><p style="color:var(--muted);font-size:11px">Tạo bản sao đầy đủ của kho dữ liệu để khôi phục khi cần.</p><div class="actions"><button class="btn" onclick="action('createBackup','Đã tạo backup an toàn')">${icons.download} Backup ngay</button><button class="btn" onclick="openBackups()">Khôi phục</button><button class="btn" onclick="action('createBackupTrigger','Đã bật backup tự động lúc 02:00')">Tự động</button></div></article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Export dữ liệu</h3><span>CSV tương thích Excel</span></div><div class="actions"><button class="btn" onclick="downloadCsv('DOI_TUONG')">Đối tượng</button><button class="btn" onclick="downloadCsv('CHUNG_TU_CONG_NO')">Chứng từ</button><button class="btn" onclick="downloadCsv('THANH_TOAN')">Thanh toán</button></div></article><article class="card panel"><div class="panel-head"><h3>Import CSV</h3><span>Báo lỗi theo từng dòng</span></div><div class="form-grid"><div class="field"><label>LOẠI DỮ LIỆU</label><select id="import-type"><option value="DOI_TUONG">Đối tượng</option><option value="CHUNG_TU_CONG_NO">Chứng từ</option></select></div><div class="field"><label>FILE CSV (TỐI ĐA 2 MB)</label><input id="import-file" type="file" accept=".csv,text/csv"></div></div><button class="btn" style="margin-top:14px" onclick="uploadCsv()">Kiểm tra & Import</button></article></div>`}

function paymentFields(preset){const open=state.documents.filter(d=>d.outstanding>0),selectedDoc=open.find(d=>d.Ma_CT===preset)||open[0];if(!selectedDoc)return `<div class="field full"><div class="notice payment-unavailable" role="status">Chưa có chứng từ còn dư để thanh toán. Hãy tạo chứng từ trước, sau đó quay lại mục này.</div></div>`;return `<div class="field"><label>KHÁCH HÀNG / NHÀ CUNG CẤP</label><select name="Ma_DT" required>${partnerOptions(selectedDoc.Ma_DT)}</select></div><div class="field"><label>LOẠI GIAO DỊCH</label><select name="Loai_Cong_No" required><option value="PHAI_THU" ${selectedDoc.Loai_Cong_No==='PHAI_THU'?'selected':''}>Thu tiền khách hàng</option><option value="PHAI_TRA" ${selectedDoc.Loai_Cong_No==='PHAI_TRA'?'selected':''}>Trả tiền nhà cung cấp</option></select></div><div class="field"><label>NGÀY THANH TOÁN</label><input type="date" name="Ngay_Thanh_Toan" value="${isoToday()}" required></div><div class="field"><label>SỐ TIỀN</label><input type="number" min="1" step="1" name="So_Tien" id="pay-amount" inputmode="numeric" required></div><div class="field full"><label>PHÂN BỔ VÀO CHỨNG TỪ</label><select id="pay-doc" required onchange="syncPaymentDocument()">${open.map(d=>`<option value="${esc(d.Ma_CT)}" data-amount="${d.outstanding}" ${d.Ma_CT===selectedDoc.Ma_CT?'selected':''}>${esc(d.So_Chung_Tu)} — còn ${vnd(d.outstanding)}</option>`).join('')}</select></div><div class="field"><label>PHƯƠNG THỨC</label><select name="Phuong_Thuc"><option value="CHUYEN_KHOAN">Chuyển khoản</option><option value="TIEN_MAT">Tiền mặt</option></select></div><div class="field"><label>MÃ THAM CHIẾU / GHI CHÚ</label><input name="Tham_Chieu"></div>`}
function syncPaymentDocument(){const doc=$('#pay-doc'),form=$('#entity-form'),document=state.documents.find(d=>d.Ma_CT===doc?.value);if(!document||!form)return;form.elements.Ma_DT.value=document.Ma_DT;form.elements.Loai_Cong_No.value=document.Loai_Cong_No;const amount=form.elements.So_Tien;amount.max=document.outstanding;amount.placeholder=`Tối đa ${vnd(document.outstanding)}`}

function enhanceInteractiveUi(){const modal=$('#modal-root .modal');if(modal&&!modal.dataset.a11yReady){modal.dataset.a11yReady='true';modalReturnFocus=modalReturnFocus||document.activeElement;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.tabIndex=-1;const title=modal.querySelector('h3');if(title){title.id=title.id||`dialog-title-${Date.now()}`;modal.setAttribute('aria-labelledby',title.id)}modal.querySelectorAll('button').forEach(button=>{if(button.textContent.trim()==='×'&&!button.getAttribute('aria-label'))button.setAttribute('aria-label','Đóng hộp thoại')});modal.querySelectorAll('.field').forEach((field,index)=>{const label=field.querySelector(':scope>label'),control=field.querySelector('input,select,textarea');if(label&&control){control.id=control.id||`field-${Date.now()}-${index}`;label.htmlFor=control.id}});requestAnimationFrame(()=>{const target=modal.querySelector('input:not([type=hidden]),select,textarea,button');(target||modal).focus()})}document.querySelectorAll('#page-debts tbody tr[onclick]').forEach(row=>{if(row.dataset.keyboardReady)return;row.dataset.keyboardReady='true';row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label',`Xem chi tiết ${row.cells[0]?.textContent.trim()||'chứng từ'}`);row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();row.click()}})})}

document.addEventListener('keydown',event=>{const modal=$('#modal-root .modal');if(!modal)return;if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key!=='Tab')return;const focusable=[...modal.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
async function submitForm(e){e.preventDefault();const form=e.target,data={};new FormData(form).forEach((v,k)=>data[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>data[c.name]=c.checked);if(form.dataset.rpc==='recordPayment'){const doc=$('#pay-doc');if(!doc||!doc.value){toast('Chưa có chứng từ còn dư để thanh toán',true);return}const selected=doc.options[doc.selectedIndex];data.Phan_Bo=[{Ma_CT:doc.value,So_Tien_Phan_Bo:Number(data.So_Tien)}];const document=state.documents.find(d=>d.Ma_CT===doc.value);if(document){data.Ma_DT=document.Ma_DT;data.Loai_Cong_No=document.Loai_Cong_No}if(Number(data.So_Tien)>Number(selected?.dataset.amount||0)){toast('Số tiền vượt dư còn lại của chứng từ',true);return}}try{form.querySelector('button[type=submit],button.btn.primary').disabled=true;const result=await rpc(form.dataset.rpc,data);if(result?.credit?.exceeded)toast(`Cảnh báo: vượt hạn mức ${vnd(result.credit.exceededBy)}`,true);else toast('Đã lưu dữ liệu');closeModal();await refreshStateAfterMutation()}catch(err){toast(err.message,true);form.querySelector('button[type=submit],button.btn.primary').disabled=false}}

async function action(name,message){try{await rpc(name);toast(message)}catch(e){toast(e.message,true)}}async function makePdf(documentType='PAYMENT_NOTICE'){const partner=$('#report-partner')?.value;if(!partner){toast('Hãy chọn khách hàng hoặc nhà cung cấp có công nợ',true);return}try{const isReconciliation=documentType==='RECONCILIATION',label=isReconciliation?'Biên bản đối chiếu công nợ':'Thư đề nghị thanh toán';toast(isReconciliation?'Đang lập biên bản đối chiếu…':'Đang lập thư đề nghị thanh toán…');const r=await rpc('generateDebtPdf',partner,documentType);toast(`Đã tạo ${label.toLowerCase()} · ${vnd(r.total)}`);$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px"><div class="modal-head"><div><div class="eyebrow">Tạo tài liệu thành công</div><h3>${label}</h3><p>PDF đã được lưu trong thư mục báo cáo của workspace.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="notice"><strong>${esc(r.name||label)}</strong><br>Tổng giá trị: ${vnd(r.total)}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Đóng</button><a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Mở và kiểm tra PDF</a></div></div></div>`}catch(e){toast(e.message,true)}}async function downloadCsv(table){try{const csv=await rpc('exportCsv',table),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FINDEBT_${table}_${isoToday()}.csv`;a.click();URL.revokeObjectURL(a.href)}catch(e){toast(e.message,true)}}
async function uploadCsv(){const file=$('#import-file').files[0];if(!file){toast('Hãy chọn file CSV',true);return}if(file.size>2000000){toast('File vượt giới hạn 2 MB',true);return}try{const result=await rpc('importCsv',$('#import-type').value,await file.text(),file.name);toast(`Import: ${result.success} thành công, ${result.failed} lỗi`,result.failed>0);await refreshStateAfterMutation()}catch(e){toast(e.message,true)}}
async function openBackups(){try{const rows=await rpc('listBackups');$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><h3>Khôi phục backup</h3><p>Thao tác sẽ ghi đè kho hiện tại. Hãy tạo backup mới trước.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div>${rows.length?`<div class="list">${rows.map(r=>`<div class="list-row"><div class="initial">BK</div><div class="list-main"><strong>${esc(r.name)}</strong><small>${date(r.updatedAt)}</small></div><button class="btn danger" onclick="restore('${esc(r.id)}')">Khôi phục</button></div>`).join('')}</div>`:empty('Chưa có bản backup')}</div></div>`}catch(e){toast(e.message,true)}}

function renderSettingsV2(){const w=state.workspace||{},h=state.health||{score:0,issues:[],metrics:{}},owner=w.role==='OWNER';$('#page-settings').innerHTML=sectionHead('Quản trị workspace','Cấu hình & phân quyền','Kiểm soát tài khoản, thành viên, chất lượng dữ liệu và vị trí lưu trữ.',button('Thêm tài khoản',"openModal('bank')"))+`<div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Workspace hiện tại</h3><span class="member-role">${esc(roleLabel(w.role))}</span></div><div class="list"><div class="list-row"><div class="initial">WS</div><div class="list-main"><strong>${esc(state.config.TEN_DOANH_NGHIEP)}</strong><small>${esc(w.email)} · ${esc(w.workspaceId)}</small></div><span class="badge green">Tách biệt</span></div></div><div class="workspace-links" style="margin-top:14px"><a class="btn" href="${esc(w.spreadsheetUrl)}" target="_blank" rel="noopener">Google Sheet</a><a class="btn" href="${esc(w.rootFolderUrl)}" target="_blank" rel="noopener">Drive</a><button class="btn danger" onclick="disconnectUi()">Ngắt liên kết</button></div></article><article class="card panel"><div class="panel-head"><h3>Kiểm tra thông minh</h3><span>${h.score}/100</span></div>${h.issues?.length?`<div class="error-list">${h.issues.map(i=>`<div class="error-line">${esc(i.message)}</div>`).join('')}</div>`:`<div class="empty"><span class="badge green">Không phát hiện vấn đề</span></div>`}<div class="list" style="margin-top:12px"><div class="list-row"><div class="list-main"><strong>${h.metrics?.backups||0} backup</strong><small>Gần nhất: ${h.metrics?.lastBackupAt?date(h.metrics.lastBackupAt):'Chưa có'}</small></div></div><div class="list-row"><div class="list-main"><strong>${h.metrics?.duplicateNames||0} nghi trùng · ${h.metrics?.invalidEmails||0} email lỗi</strong><small>Kiểm tra nền, không chặn tải ứng dụng</small></div></div></div></article></div><div class="two-cols"><article class="card panel"><div class="panel-head"><h3>Thành viên</h3><span>${state.members?.length| async function uploadCsvV2(){const file=$('#import-file').files[0];if(!file){toast('Hãy chọn file CSV',true);return}if(file.size>2000000){toast('File vượt giới hạn 2 MB',true);return}try{const type=$('#import-type').value,text=await file.text(),result=await rpc('previewCsv',type,text,file.name);pendingImport={type,text,name:file.name};$('#modal-root').innerHTML=`<div class="modal-backdrop open"><div class="modal"><div class="modal-head"><div><h3>Kiểm tra trước khi nhập</h3><p>${esc(file.name)} · ${result.total} dòng</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="kpi-head">Hợp lệ</div><div class="value">${result.valid}</div></div><div class="card kpi"><div class="kpi-head">Có lỗi</div><div class="value">${result.failed}</div></div><div class="card kpi"><div class="kpi-head">Tổng</div><div class="value">${result.total}</div></div></div>${result.errors.length?`<div class="error-list">${result.errors.slice(0,12).map(e=>`<div class="error-line">Dòng ${e.row}: ${esc(e.message)}</div>`).join('')}</div>`:'<div class="notice" style="color:var(--green);background:rgba(94,226,139,.08);margin-top:14px">Tất cả dòng hợp lệ. Bạn có thể ghi dữ liệu.</div>'}<div class="modal-foot"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn primary" ${result.canCommit?'':'disabled'} onclick="commitImportUi(event)">Xác nhận nhập ${result.valid} dòng</button></div></div></div>`}catch(e){toast(e.message,true)}}
async function commitImportUi(clickEvent){if(!pendingImport)return;const button=clickEvent.currentTarget;try{button.disabled=true;button.textContent='Đang ghi dữ liệu…';const r=await rpc('commitCsv',pendingImport.type,pendingImport.text,pendingImport.name);pendingImport=null;toast(`Đã nhập ${r.success} dòng`);closeModal();await refreshStateAfterMutation()}catch(e){toast(e.message,true);button.disabled=false}}
async function importFromSheetUi(){try{const type=$('#import-type').value,r=await rpc('importFromSheet',type);toast(`Đã nhập ${r.success} dòng từ Sheet`);await refreshStateAfterMutation()}catch(e){toast(e.message,true)}}
async function cloneUi(mode){const labels={TEMPLATE:'mẫu trống',FULL:'bản sao đầy đủ',SNAPSHOT:'snapshot'};if(!confirm(`Tạo ${labels[mode]} của toàn bộ workspace?`))return;try{toast('Đang sao chép workspace…');const r=await rpc('cloneWorkspace',mode);toast('Đã tạo workspace mới');window.open(r.url,'_blank','noopener')}catch(e){toast(e.message,true)}}
async function addMemberUi(){try{await rpc('saveMember',{email:$('#member-email').value,role:$('#member-role').value});toast('Đã cập nhật thành viên');await refreshStateAfterMutation()}catch(e){toast(e.message,true)}}
async function removeMemberUi(email){if(!confirm(`Gỡ quyền của ${email}?`))return;try{await rpc('removeMember',email);toast('Đã gỡ thành viên');await refreshStateAfterMutation()}catch(e){toast(e.message,true)}}
async function disconnectUi(){if(!confirm('Ngắt liên kết trên tài khoản này? Dữ liệu trong Drive không bị xóa.'))return;try{await rpc('disconnectWorkspace');location.reload()}catch(e){toast(e.message,true)}}
function toast(message,error=false){const el=document.createElement('div');el.className=`toast ${error?'error':''}`;el.textContent=message;$('#toast-stack').append(el);setTimeout(()=>el.remove(),4500)}function empty(text){return `<div class="empty"><div class="empty-icon">${icons.file}</div>${text}</div>`}function partnerName(id){return state.partners.find(p=>p.Ma_DT===id)?.Ten_DT||id}function localDateKey(value=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(value),map=Object.fromEntries(parts.map(part=>[part.type,part.value]));return `${map.year}-${map.month}-${map.day}`}function isoToday(){return localDateKey()}
function renderDashboardV2(){renderDashboard();const perf=state.performance||{};$('#page-dashboard .hero-row').insertAdjacentHTML('afterend',`<div class="action-center"><button class="action-primary" onclick="openModal('payment')"><strong>Ghi nhận thu / trả tiền</strong><small>Hành động chính · phân bổ trực tiếp vào chứng từ</small></button><button class="action-tile" onclick="openModal('document')"><strong>Thêm chứng từ</strong><small>Tự tính hạn theo khách hàng hoặc nhà cung cấp</small></button><button class="action-tile" onclick="filterFromDashboard('OVERDUE')"><strong>Xử lý quá hạn</strong><small>${state.dashboard.overdue?.length||0} khoản ưu tiên</small></button><button class="action-tile" onclick="go('reports')"><strong>Nhập hàng loạt</strong><small>Mở Sheet hoặc CSV</small></button></div>`);document.querySelectorAll('#page-dashboard .kpi').forEach((card,index)=>{card.classList.add('clickable');card.onclick=()=>filterFromDashboard(index===3?'OVERDUE':index===0?'OPEN':'ALL')});document.querySelectorAll('#page-dashboard .aging-item').forEach(item=>{item.classList.add('clickable');item.onclick=()=>filterFromDashboard('OVERDUE')});$('#page-dashboard .hero-row p').insertAdjacentHTML('beforeend',` <span class="performance-pill">· ${perf.bootstrapMs||0} ms ${perf.cacheHit?'· cache':''}</span>`)}
function filterFromDashboard(status){debtQuery.status=status;debtQuery.page=1;saveDebtView();go('debts');loadDebtPage(true)}
function saveDebtView(){storageSet('findebt-debt-view',JSON.stringify({type:debtQuery.type,status:debtQuery.status,sort:debtQuery.sort}));const url=new URL(location.href);[['debtType',debtQuery.type],['debtStatus',debtQuery.status],['debtSort',debtQuery.sort],['debtQuery',debtQuery.search]].forEach(([key,value])=>value&&value!=='ALL'?url.searchParams.set(key,value):url.searchParams.delete(key));history.replaceState(history.state,'',url)}
function restoreDebtView(){try{Object.assign(debtQuery,JSON.parse(storageGet('findebt-debt-view')||'{}'));const params=new URL(location.href).searchParams;debtQuery.type=params.get('debtType')||debtQuery.type;debtQuery.status=params.get('debtStatus')||debtQuery.status;debtQuery.sort=params.get('debtSort')||debtQuery.sort;debtQuery.search=params.get('debtQuery')||''}catch(_error){storageRemove('findebt-debt-view')}}
async function loadDebtPage(reset=false){if(reset){debtQuery.page=1;debtPage.rows=[]}try{const result=await rpc('loadDocumentsPage',debtQuery);debtPage={...result,rows:reset?result.rows:[...debtPage.rows,...result.rows],loaded:true};state.documents=debtPage.rows;renderDebtsV2()}catch(e){toast(e.message,true)}}
function changeDebtFilter(field,value){debtQuery[field]=value;debtQuery.page=1;saveDebtView();loadDebtPage(true)}
function searchDebts(value){clearTimeout(debtSearchTimer);debtSearchTimer=setTimeout(()=>{debtQuery.search=value;saveDebtView();loadDebtPage(true)},280)}

function renderDebtsV2(){const rows=debtPage.rows.length?debtPage.rows:(state.documents||[]),selected=rows.find(row=>row.Ma_CT===selectedDebtId)||rows[0];if(selected&&!selectedDebtId)selectedDebtId=selected.Ma_CT;$('#page-debts').innerHTML=sectionHead('Sổ công nợ','Chứng từ phải thu / phải trả',`Đang hiển thị ${rows.length}/${debtPage.total||rows.length} chứng từ.`,button('Thêm chứng từ',"openModal('document')"))+`<div class="filterbar"><input class="field-inline" value="${esc(debtQuery.search)}" oninput="searchDebts(this.value)" placeholder="Tìm chứng từ, đối tượng..."><div class="segmented">${[['ALL','Tất cả'],['OPEN','Còn nợ'],['OVERDUE','Quá hạn'],['PAID','Đã trả']].map(([value,label])=>`<button class="${debtQuery.status===value?'active':''}" data-debt-status="${value}">${label}</button>`).join('')}</div><select class="field-inline" onchange="changeDebtFilter('type',this.value)"><option value="ALL">Mọi loại</option><option value="PHAI_THU" ${debtQuery.type==='PHAI_THU'?'selected':''}>Phải thu</option><option value="PHAI_TRA" ${debtQuery.type==='PHAI_TRA'?'selected':''}>Phải trả</option></select><select class="field-inline" onchange="changeDebtFilter('sort',this.value)"><option value="DATE_DESC">Mới nhất</option><option value="DUE_ASC" ${debtQuery.sort==='DUE_ASC'?'selected':''}>Hạn gần nhất</option><option value="OUTSTANDING_DESC" ${debtQuery.sort==='OUTSTANDING_DESC'?'selected':''}>Dư nợ lớn nhất</option></select></div><div class="debt-layout"><article class="card panel table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Chứng từ</th><th>Đối tượng</th><th>Loại</th><th>Hạn TT</th><th>Còn lại</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(row=>`<tr class="${row.Ma_CT===selectedDebtId?'selected':''}" onclick="selectDebt('${esc(row.Ma_CT)}')"><td><strong>${esc(row.So_Chung_Tu)}</strong><br><small>${date(row.Ngay_Chung_Tu)}</small></td><td>${esc(row.partnerName||partnerName(row.Ma_DT))}</td><td>${row.Loai_Cong_No==='PHAI_THU'?'Phải thu':'Phải trả'}</td><td>${date(row.Han_Thanh_Toan)}</td><td class="money">${vnd(row.outstanding)}</td><td>${statusBadge(row)}</td></tr>`).join('')}</tbody></table><div class="load-more"><span>${rows.length}/${debtPage.total||rows.length}</span>${debtPage.hasMore?'<button class="btn" onclick="loadMoreDebts()">Tải thêm</button>':''}<span class="performance-pill">${debtPage.performance?.queryMs||0} ms</span></div>`:empty('Không có chứng từ phù hợp')}</article>${renderDebtDetail(selected)}</div>`}
function renderDebtDetail(row){if(!row)return `<aside class="card panel debt-detail">${empty('Chọn một chứng từ để xem chi tiết')}</aside>`;return `<aside class="card panel debt-detail"><div class="eyebrow">Chi tiết chứng từ</div><h3>${esc(row.So_Chung_Tu)}</h3><span>${statusBadge(row)}</span><div class="detail-grid"><div class="detail-metric"><small>Đối tượng</small><strong>${esc(row.partnerName||partnerName(row.Ma_DT))}</strong></div><div class="detail-metric"><small>Loại</small><strong>${row.Loai_Cong_No==='PHAI_THU'?'Phải thu':'Phải trả'}</strong></div><div class="detail-metric"><small>Tiền gốc</small><strong>${vnd(row.originalAmount)}</strong></div><div class="detail-metric"><small>Còn lại</small><strong>${vnd(row.outstanding)}</strong></div><div class="detail-metric"><small>Hạn thanh toán</small><strong>${date(row.Han_Thanh_Toan)}</strong></div><div class="detail-metric"><small>Quá hạn</small><strong>${Math.max(0,row.daysOverdue||0)} ngày</strong></div></div><div class="actions">${row.outstanding>0?`<button class="btn primary" onclick="openModal('payment','${esc(row.Ma_CT)}')">Thu / trả tiền</button>`:''}${row.Loai_Cong_No==='PHAI_THU'&&row.outstanding>0?`<button class="btn" onclick="showQr('${esc(row.Ma_CT)}')">VietQR</button>`:''}</div></aside>`}

function companyInitials(){return String(state.config?.TEN_DOANH_NGHIEP||'DN').trim().split(/\s+/).slice(0,2).map(word=>word[0]).join('').toUpperCase()}
function companyLogoUrl(){const id=state.config?.LOGO_FILE_ID;return id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w400`:''}
function openCompanyProfileModal(){const c=state.config||{},logo=companyLogoUrl(),logoPreview=logo?'<img src="'+esc(logo)+'" alt="Logo hiện tại">':esc(companyInitials());$('#modal-root').innerHTML=`<div class="modal-backdrop open" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(760px,100%)"><div class="modal-head"><div><h3>Hồ sơ doanh nghiệp</h3><p>Thông tin này được dùng thống nhất trên ứng dụng và các phiếu công nợ.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><form id="company-profile-form" onsubmit="saveCompanyProfileUi(event)"><div class="form-grid"><div class="logo-upload"><div id="company-logo-preview" class="logo-preview">${logoPreview}</div><div class="field"><label>LOGO DOANH NGHIỆP</label><input type="file" name="logo" accept="image/png,image/jpeg" onchange="previewCompanyLogo(this)"><p class="field-help">PNG hoặc JPG, nên dùng nền trong suốt, tối đa 1,5 MB.</p>${c.LOGO_FILE_ID?'<label class="checkbox"><input type="checkbox" name="removeLogo"> Xóa logo hiện tại</label>':''}</div></div><div class="field full"><label>TÊN DOANH NGHIỆP *</label><input name="TEN_DOANH_NGHIEP" required maxlength="120" value="${esc(c.TEN_DOANH_NGHIEP||'')}"></div><div class="field"><label>MÃ SỐ THUẾ</label><input name="MA_SO_THUE" maxlength="30" value="${esc(c.MA_SO_THUE||'')}"></div><div class="field"><label>SỐ ĐIỆN THOẠI</label><input name="SO_DIEN_THOAI" maxlength="30" value="${esc(c.SO_DIEN_THOAI||'')}"></div><div class="field full"><label>ĐỊA CHỈ TRỤ SỞ</label><input name="DIA_CHI_DOANH_NGHIEP" maxlength="300" value="${esc(c.DIA_CHI_DOANH_NGHIEP||'')}"></div><div class="field"><label>EMAIL KẾ TOÁN</label><input type="email" name="EMAIL_KE_TOAN" value="${esc(c.EMAIL_KE_TOAN||'')}"></div><div class="field"><label>WEBSITE</label><input name="WEBSITE" placeholder="tenmien.vn" value="${esc(c.WEBSITE||'')}"></div><div class="field"><label>NGƯỜI ĐẠI DIỆN</label><input name="NGUOI_DAI_DIEN" value="${esc(c.NGUOI_DAI_DIEN||'')}"></div><div class="field"><label>CHỨC VỤ</label><input name="CHUC_VU_DAI_DIEN" value="${esc(c.CHUC_VU_DAI_DIEN||'')}"></div></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn primary">Lưu và áp dụng</button></div></form></div></div>`}
function previewCompanyLogo(input){const file=input.files?.[0];if(!file)return;if(file.size>1500000){toast('Logo không được vượt quá 1,5 MB',true);input.value='';return}const reader=new FileReader();reader.onload=()=>{const preview=$('#company-logo-preview'),image=document.createElement('img');image.src=String(reader.result||'');image.alt='Logo mới';preview.replaceChildren(image)};reader.readAsDataURL(file)}
function readFileDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Không thể đọc file logo.'));reader.readAsDataURL(file)})}
async function saveCompanyProfileUi(event){event.preventDefault();const form=event.currentTarget,submit=form.querySelector('button[type=submit]'),file=form.elements.logo.files?.[0],data={};new FormData(form).forEach((value,key)=>{if(key!=='logo'&&key!=='removeLogo')data[key]=value});data.removeLogo=Boolean(form.elements.removeLogo?.checked);try{submit.disabled=true;submit.textContent='Đang lưu hồ sơ…';if(file)data.logoDataUrl=await readFileDataUrl(file);await rpc('saveCompanyProfile',data);closeModal();await refreshStateAfterMutation();toast('Đã cập nhật hồ sơ và mẫu phiếu doanh nghiệp')}catch(error){toast(error.message,true);submit.disabled=false;submit.textContent='Lưu và áp dụng'}}
async function refreshHealthUi(){try{toast('Đang kiểm tra Drive, backup và chất lượng dữ liệu…');const result=await rpc('loadWorkspaceHealth');state.health=result.health;injectHealth();renderSettingsV3()}catch(e){toast(e.message,true)}}
async function syncConsoleUi(){try{const result=await rpc('syncDataConsole');toast(`Đã đồng bộ Data Console lúc ${new Date(result.syncedAt).toLocaleTimeString('vi-VN')}`)}catch(e){toast(e.message,true)}}
async function seedDemoUi(){if(!confirm('Tạo bộ dữ liệu mẫu để kiểm thử? Chạy lại sẽ không nhân đôi dữ liệu mẫu.'))return;try{toast('Đang tạo dữ liệu mẫu và đồng bộ Google Sheet…');const result=await rpc('seedDemoData');await refreshStateAfterMutation();toast(`Đã sẵn sàng: ${result.partners} đối tượng, ${result.documents} chứng từ, ${result.payments} thanh toán`)}catch(e){toast(e.message,true)}}
function supportQrUrl(){const support=AUTHOR.support,params=new URLSearchParams({addInfo:support.message});if(support.accountName)params.set('accountName',support.accountName);return `https://img.vietqr.io/image/${encodeURIComponent(support.bankCode)}-${encodeURIComponent(support.account)}-compact2.png?${params}`}
async function copySupportAccount(){try{await navigator.clipboard.writeText(AUTHOR.support.account);toast('Đã sao chép số tài khoản Techcombank')}catch(_error){const input=document.createElement('textarea');input.value=AUTHOR.support.account;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();document.execCommand('copy');input.remove();toast('Đã sao chép số tài khoản Techcombank')}}
function renderAbout(){const support=AUTHOR.support,owner=support.accountName||'Kiểm tra tên người nhận trong ứng dụng ngân hàng';$('#page-about').innerHTML=sectionHead('Thông tin sản phẩm','Tác giả & hỗ trợ','Hướng dẫn chính thức, kênh liên hệ và thông tin phát triển FINDEBT PRO.')+`<div class="author-hero"><article class="card author-card"><div class="author-lockup"><img class="author-logo" src="assets/vtarch-symbol-256.png" width="86" height="86" alt="Biểu tượng VTARCH"><div class="author-copy"><div class="eyebrow">Thiết kế & phát triển</div><h3>${esc(AUTHOR.name)}</h3><p>FINDEBT PRO được xây dựng để doanh nghiệp Việt Nam quản lý công nợ minh bạch, gọn gàng và sở hữu dữ liệu ngay trong Google Drive của mình.</p></div></div><div class="author-links"><a class="author-link" href="mailto:${esc(AUTHOR.email)}"><span><small>Email</small>${esc(AUTHOR.email)}</span><b>↗</b></a><a class="author-link" href="${esc(AUTHOR.website)}" target="_blank" rel="noopener"><span><small>Website</small>vtarch.vercel.app</span><b>↗</b></a><a class="author-link" href="${esc(AUTHOR.github)}" target="_blank" rel="noopener"><span><small>Mã nguồn GitHub</small>vtarchvn/findebt-pro</span><b>↗</b></a><div class="author-link"><span><small>Phiên bản</small>FINDEBT PRO ${esc(AUTHOR.version)}</span><b>●</b></div></div></article><aside class="card support-card"><a class="support-guide" href="${esc(AUTHOR.guide)}" target="_blank" rel="noopener"><span class="support-guide-icon">${icons.file}</span><span><small>Tài liệu chính thức</small><strong>Mở hướng dẫn sử dụng</strong><em>Cài đặt, nhập liệu, thanh toán, nhắc nợ và backup</em></span><b>${icons.arrow}</b></a><div class="support-divider"></div><div class="coffee-note">Một lời cảm ơn nhỏ</div><h3>Mời tôi một ly cà phê ☕</h3><p>Nếu FINDEBT giúp công việc của bạn nhẹ nhàng hơn, một ly cà phê là nguồn động viên để tôi tiếp tục chăm chút và phát triển ứng dụng.</p><div class="coffee-grid"><img class="coffee-qr" src="${esc(supportQrUrl())}" width="132" height="132" loading="lazy" alt="Mã VietQR ủng hộ tác giả FINDEBT PRO"><div class="coffee-details"><span class="coffee-bank">${esc(support.bankName)} · ${esc(support.bankCode)}</span><strong class="coffee-account">${esc(support.account)}</strong><span class="coffee-owner">${esc(owner)}</span><button class="btn coffee-copy" onclick="copySupportAccount()">Sao chép số tài khoản</button></div></div><p class="coffee-thanks">Bạn tự chọn số tiền phù hợp — sự tin tưởng và phản hồi của bạn đã là một sự ủng hộ quý giá.</p><div class="list product-facts"><div class="list-row"><div class="initial">01</div><div class="list-main"><strong>Báo lỗi</strong><small>Gửi ảnh và mô tả thao tác qua email tác giả.</small></div></div><div class="list-row"><div class="initial">02</div><div class="list-main"><strong>Đề xuất tính năng</strong><small>Theo dõi và đóng góp tại GitHub.</small></div></div></div></aside></div>`}
function bindSmartDocumentDefaults(event){const target=event.target,form=target.closest?.('#entity-form');if(!form||form.dataset.rpc!=='createDocument'||!['Ma_DT','Ngay_Chung_Tu'].includes(target.name))return;const partner=state.partners.find(row=>row.Ma_DT===form.elements.Ma_DT.value),start=new Date(`${form.elements.Ngay_Chung_Tu.value||isoToday()}T12:00:00+07:00`);start.setDate(start.getDate()+Number(partner?.Thoi_Han_No_Chuan||30));form.elements.Han_Thanh_Toan.value=localDateKey(start)}
function showClientStartupError(error){const loading=$('#loading');if(!loading)return;loading.innerHTML=`<div class="setup"><div class="loader-mark">!</div><h1>Giao diện chưa khởi động</h1><p>${esc(error?.message||error)}</p><button class="btn primary" onclick="reloadApp()">Tải lại ứng dụng</button></div>`}
function bootClient(){try{if(window.__FINDEBT_BOOT_WATCHDOG__)clearTimeout(window.__FINDEBT_BOOT_WATCHDOG__);setStartupStatus('Giao diện đã chạy. Đang chuẩn bị kết nối…');restoreDebtView();setupNav();renderIcons();document.addEventListener('change',bindSmartDocumentDefaults);document.addEventListener('click',event=>{const trigger=event.target.closest?.('[data-debt-status]');if(trigger)changeDebtFilter('status',trigger.dataset.debtStatus)});window.addEventListener('popstate',()=>go(location.hash.slice(1)||'dashboard',false));$('#theme-btn').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;storageSet('theme',theme)};$('#global-search').oninput=e=>{const q=e.target.value.toLocaleLowerCase('vi-VN');document.querySelectorAll('.page.active .data-table tbody tr').forEach(row=>row.hidden=!row.textContent.toLocaleLowerCase('vi-VN').includes(q))};load()}catch(error){showClientStartupError(error)}}
bootClient();
</script>
</body>
</html>
